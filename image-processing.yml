items:
  - info:
      name: Login
      type: http
      seq: 3
    http:
      method: POST
      url: '{{url}}/auth/login'
      body:
        type: json
        data: |-
          {
            "email": "s.kimsinh@gmail.com",
            "password": "kimsinh@00"
          }
      auth:
        type: bearer
        token: '{{access_token}}'
    runtime:
      scripts:
        - type: after-response
          code: |-
            const token = res.body?.data?.access_token;
            const refresh_token = res?.body?.data.refresh_token;
            if (token) {
              bru.setEnvVar("access_token",token);  // if created under Environments
            }
            if(refresh_token){
              bru.setEnvVar("refresh_token",refresh_token); 
            }
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Register
      type: http
      seq: 2
    http:
      method: POST
      url: '{{url}}/auth/register'
      body:
        type: json
        data: |-
          {
            "username":"kimsinh",
            "email":"s.kimsinh1@gmail.com",
            "password":"kimsinh@00"
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Untitled
      type: http
      seq: 1
    http:
      method: GET
      url: '{{url}}/user/1'
      auth: inherit
    runtime:
      variables:
        - name: url
          value: http://localhost:3000
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: refresh token
      type: http
      seq: 4
    http:
      method: POST
      url: '{{url}}/auth/refresh'
      body:
        type: json
        data: |-
          {
            "token":"{{refresh_token}}"
          }
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
request:
  auth:
    type: bearer
    token: '{{access_token}}'
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-10-13T15:27:09.913Z'
    exportedUsing: Bruno
